# GitHub Actions workflow: build the Docker image.

name: Docker

# Run on push to a branch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Allow the jobs to push images to the GitHub container registry (GHCR).
permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # Build the image from the `Dockerfile`.
  build:
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{ steps.changes.outputs.src }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'src/**'
      # Image names on GHCR must be lowercase.
      - name: Set the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build the image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
      - name: Show the image revision
        run: docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:$GITHUB_SHA"
      # List what `COPY . .` put in the image. The contents of `.git` and `__pycache__` are hidden.
      - name: Show the files in the image
        run: docker run --rm "$IMAGE:$GITHUB_SHA" find . \( -name .git -o -name __pycache__ \) -prune -print -o -print
      - name: Log in to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push the image
        run: |
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$BRANCH_TAG"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$BRANCH_TAG"

  train:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.build.outputs.source_changed == 'true')
    uses: ./.github/workflows/train-docker.yml
    with:
      image_tag: ${{ github.sha }}

  deploy:
    needs: train
    uses: ./.github/workflows/deploy.yml
    with:
      model_run_id: ${{ github.run_id }}
